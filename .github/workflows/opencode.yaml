name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # DIVERGES FROM shared_workflow/stubs/opencode.yml -- do not drop this guard
    # when re-syncing with upstream.
    #
    # The author_association check is a local addition. Upstream's
    # opencode.reusable.yml guards only on `comment.user.type != 'Bot'`, so on a
    # PUBLIC repository any GitHub user could post `/oc <instructions>` and drive
    # an agent that holds contents: write, pull-requests: write and
    # OPENCODE_API_KEY. `issue_comment` runs on the default branch with full
    # secrets, and is NOT covered by the Actions setting that requires approval
    # for fork pull request workflows -- that setting only gates fork PR runs.
    #
    # Remove this block only once the reusable workflow performs its own
    # authorization check.
    #
    # Note for org-owned forks of this template: a user whose write access comes
    # via an organization team may report as MEMBER rather than COLLABORATOR. Add
    # MEMBER only if that applies -- it is looser, because org membership does not
    # by itself imply write access to this repository.
    if: |
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    uses: ekawijayasusilo/shared_workflow/.github/workflows/opencode.reusable.yml@v1.2.0
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
